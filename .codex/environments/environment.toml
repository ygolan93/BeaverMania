# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "Beavermania Safe Local"

[setup]
script = ""

[setup.win32]
script = '''
$ErrorActionPreference = "Continue"

Write-Host "=== Beavermania Codex local setup ==="

Write-Host ""
Write-Host "=== Repository status ==="
git status --short --branch

Write-Host ""
Write-Host "=== Checking diff hygiene ==="
git diff --check

Write-Host ""
Write-Host "=== Checking optional CI project ==="
if (Test-Path ".ci/BeaverMania.CI.csproj") {
    Write-Host "CI project found."
    if (Get-Command dotnet -ErrorAction SilentlyContinue) {
        Write-Host "Restoring CI project dependencies..."
        dotnet restore ".ci/BeaverMania.CI.csproj"
    } else {
        Write-Host "dotnet was not found. Skipping restore."
    }
} else {
    Write-Host "No .ci/BeaverMania.CI.csproj found. Skipping."
}

Write-Host ""
Write-Host "=== Setup complete ==="
'''

[cleanup]
script = ""

[cleanup.win32]
script = '''
Write-Host "Cleaning safe temporary files only..."

$paths = @(
  "Logs",
  "Temp",
  "obj",
  "debug.log",
  "debug-*.log"
)

foreach ($path in $paths) {
  if (Test-Path $path) {
    Write-Host "Removing $path"
    Remove-Item $path -Recurse -Force -ErrorAction SilentlyContinue
  }
}

Write-Host ""
Write-Host "Done. Current status:"
git status --short --branch
'''

[[actions]]
name = "Git Status"
icon = "run"
command = '''
git status --short --branch
git diff --name-only
'''
platform = "win32"

[[actions]]
name = "Diff Check"
icon = "run"
command = "git diff --check"
platform = "win32"

[[actions]]
name = "Light C# Build"
icon = "test"
command = "dotnet build .ci/BeaverMania.CI.csproj"
